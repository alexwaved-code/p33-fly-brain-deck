<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slap the fly</title>
<style>
  :root { --bg: #f6f4ee; --paper: #fff; --ink: #16150f; --soft: #57544c; --faint: #a39f95; --line: #e0dcd1; --blue: #2563eb; --amber: #e08a00; --green: #15803d; --pink: #e11d59; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(1100px 620px at 40% 20%, #fff 0%, transparent 70%); }
  canvas#view { position: relative; display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud { position: absolute; top: 26px; left: 34px; max-width: 34em; pointer-events: none; }
  .kick { margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  h1 { margin: 4px 0 0; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 44px; font-weight: 500; letter-spacing: -.015em; }
  .sub { margin: 6px 0 0; color: var(--soft); font-size: 16px; }
  .speed { display: none; pointer-events: auto; display: inline-flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 15px; font-weight: 600; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; box-shadow: 0 14px 40px -22px rgba(40,30,10,.3); }
  .speed input { width: 170px; accent-color: var(--amber); }
  #speedn { min-width: 4.2em; color: var(--amber); }
  .score { position: absolute; left: 34px; bottom: 28px; display: flex; gap: 12px; pointer-events: none; }
  .score div { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 10px 20px 12px; min-width: 96px; box-shadow: 0 14px 40px -22px rgba(40,30,10,.3); }
  .score small { display: block; font-weight: 700; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .score b { font: 500 40px/1 "Iowan Old Style", Palatino, Georgia, serif; font-variant-numeric: tabular-nums; }
  .score .f b { color: var(--amber); }
  #banner { position: absolute; left: 0; right: min(460px, 42vw); top: 30%; text-align: center; pointer-events: none; font: 500 92px/1 "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: -.02em; opacity: 0; transform: translateY(14px) scale(.96); transition: opacity .25s ease, transform .5s cubic-bezier(.2,.8,.2,1); text-shadow: 0 2px 0 #fff, 0 0 30px #fff; }
  #banner.on { opacity: 1; transform: none; }
  #banner.fly { color: var(--amber); } #banner.hand { color: var(--ink); }
  .side { position: absolute; top: 22px; right: 22px; width: min(430px, 40vw); background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 18px; box-shadow: 0 30px 70px -34px rgba(40,30,10,.4); }
  .side.folded { width: auto; }
  .side.folded #mapbody { display: none; }
  .sidehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side h2 { margin: 0; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 24px; font-weight: 500; }
  #fold { font: 600 12px "Avenir Next", "Segoe UI", sans-serif; color: var(--soft); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  #brainmap { width: 100%; height: min(300px, 36vh); display: block; border-radius: 14px; background: #faf8f2; margin-top: 12px; cursor: grab; touch-action: none; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 0; }
  .row span { --c: var(--blue); display: block; text-align: center; font-weight: 700; font-size: 14px; padding: 8px 4px; border-radius: 12px; border: 2px solid var(--line); color: var(--faint); background: #fff; transition: background .12s, color .12s, border-color .12s, transform .12s; }
  .row span:nth-child(2) { --c: var(--amber); } .row span:nth-child(3) { --c: var(--green); }
  .row span.on { background: var(--c); border-color: var(--c); color: #fff; transform: scale(1.04); }
  #result { margin: 14px 0 0; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 22px; line-height: 1.25; min-height: 2.5em; }
  .note { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: var(--soft); }
  .for-phone { display: none; }
  @media (max-width: 820px), (max-height: 520px) and (pointer: coarse) {
    html, body { height: 100dvh; overscroll-behavior: none; }
    canvas#view { touch-action: none; }
    .for-desk { display: none; }
    .for-phone { display: inline; }
    .hud { top: max(8px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: 7.2em; max-width: none; }
    h1 { font-size: 26px; } .kick { display: none; } .sub { font-size: 12px; }
    .speed { margin-top: 8px; font-size: 13px; }
    .speed input { width: 1px; flex: 1 1 auto; min-width: 0; }
    .score { display: none; } #banner { font-size: 44px; top: 30%; }
    .side { top: auto; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); width: auto; }
    .side.folded { left: auto; width: auto; right: max(10px, env(safe-area-inset-right)); }
    #fold { font-size: 14px; padding: 8px 14px; }
    #brainmap { height: min(200px, 28vh); }
    .note { max-height: 4.4em; overflow: auto; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <p class="kick">Live · hand vs fly</p>
  <h1>Slap the fly</h1>
  <p class="sub"><span class="for-desk">Move over the fly. Click to bring the hand down.</span><span class="for-phone">Move over the fly. Tap to bring the hand down.</span></p>
  <input id="speed" type="range" min="0" max="100" value="30" hidden>
</div>
<div class="score"><div><small>Hand</small><b id="sh">0</b></div><div class="f"><small>Fly</small><b id="sf">0</b></div></div>
<div id="banner"></div>
<aside class="side" id="side">
  <div class="sidehead">
    <h2>Inside the fly: ten cells</h2>
    <button type="button" id="fold">Hide</button>
  </div>
  <div id="mapbody">
    <canvas id="brainmap"></canvas>
    <div class="row"><span id="lc4n">LC4 × 8</span><span id="gfn">Giant fiber</span><span id="ttn">TTMn</span></div>
    <p id="result"></p>
    <p class="note" id="note"></p>
  </div>
</aside>
<script>
if (matchMedia("(max-width: 820px), (max-height: 520px) and (pointer: coarse)").matches) {
  document.getElementById("side").classList.add("folded");
  document.getElementById("fold").textContent = "Map";
}
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script src="circuit.js"></script>
<script src="glow.js"></script>
<script src="male-detail.js"></script>
<script src="data.js"></script>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "./vendor/addons/loaders/FBXLoader.js";
const C = CIRCUIT;
const N = C.neurons.length;
const decay = Math.exp(-1 / C.tau);
const sdecay = Math.exp(-1 / C.tauS);
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 120);
camera.position.set(3.4, 9.2, 27.5);
camera.lookAt(3.4, 0.6, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xfff4e5, 1.15);
sun.position.set(-4, 12, 6);
scene.add(sun);

const table = new THREE.Mesh(
  new THREE.BoxGeometry(28, 0.45, 18),
  new THREE.MeshStandardMaterial({ color: 0xe6dfcf, roughness: 0.9 })
);
table.position.y = -0.22;
scene.add(table);
const tableTop = new THREE.Mesh(
  new THREE.BoxGeometry(26, 0.08, 16),
  new THREE.MeshStandardMaterial({ color: 0xfffdf8, roughness: 0.95 })
);
tableTop.position.y = 0.02;
scene.add(tableTop);

function flyMesh() {
  const g = new THREE.Group();
  const bodyM = new THREE.MeshStandardMaterial({ color: 0x4a4038, roughness: 0.45, metalness: 0.05 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.28, 18, 12), bodyM);
  body.scale.set(1.7, 0.72, 0.85);
  body.position.y = 0.28;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 10), bodyM);
  head.position.set(0.42, 0.32, 0);
  g.add(head);
  const eyeM = new THREE.MeshStandardMaterial({ color: 0x6b1020, roughness: 0.3 });
  [-0.08, 0.08].forEach((z) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), eyeM);
    eye.position.set(0.52, 0.36, z);
    g.add(eye);
  });
  const wingM = new THREE.MeshStandardMaterial({ color: 0xd5e4f5, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const wings = [];
  [-1, 1].forEach((s) => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.28), wingM);
    w.position.set(-0.05, 0.4, s * 0.22);
    w.rotation.x = s * 0.4;
    g.add(w);
    wings.push(w);
  });
  g.userData.wings = wings;
  const legM = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [-0.12, 0.05, 0.22].forEach((x) => {
    [-1, 1].forEach((s) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.28, 5), legM);
      leg.position.set(x, 0.12, s * 0.16);
      leg.rotation.z = s * 0.5;
      g.add(leg);
    });
  });
  return g;
}
// soft contact shadows and a landing ring, so the aim reads on a light table
function disc(r, color, opacity) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; return m;
}
const grid = new THREE.GridHelper(26, 26, 0xe9e4d8, 0xefebe1); grid.scale.z = 16 / 26; grid.position.y = 0.065; scene.add(grid);
const handShadow = disc(1.15, 0x16150f, 0.12); handShadow.position.y = 0.075; scene.add(handShadow);
const flyShadow = disc(0.42, 0x16150f, 0.2); flyShadow.position.y = 0.078; scene.add(flyShadow);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1.0, 64), new THREE.MeshBasicMaterial({ color: 0xe08a00, transparent: true, opacity: 0, depthWrite: false }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.08; scene.add(ring);
let ringAt = -1e9;
const fly = new THREE.Group();
scene.add(fly);
window.__aim = () => { const p = fly.position.clone().project(camera), r = view.getBoundingClientRect(); return [(p.x + 1) / 2 * r.width, (1 - p.y) / 2 * r.height]; };
const hand = new THREE.Group();
scene.add(hand);

function seatModel(obj, target) {
  obj.traverse((child) => {
    if (child.isMesh) child.frustumCulled = false;
  });
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  let size = box.getSize(new THREE.Vector3());
  if (size.y < size.x * 0.5 && size.y < size.z * 0.5) obj.rotation.x = -Math.PI / 2;
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  obj.scale.multiplyScalar(target / maxDim);
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.x -= center.x;
  obj.position.z -= center.z;
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  obj.position.y -= box.min.y;
}

const loader = new FBXLoader();
window.__loaded = { fly: false, hand: false, err: "" };
loader.load("models/blue_insect_3d_model.fbx", (obj) => {
  seatModel(obj, 1.3);
  fly.add(obj);
  window.__loaded.fly = true;
}, undefined, (err) => { window.__loaded.err += "fly " + err; });
let handModel = null;
loader.load("models/hand_3d_model.fbx", (obj) => {
  seatModel(obj, 3.0);
  obj.rotation.set(-Math.PI / 2, Math.PI, Math.PI);
  obj.updateMatrixWorld(true);
  const grounded = new THREE.Box3().setFromObject(obj);
  obj.position.y -= grounded.min.y;
  handModel = obj;
  hand.add(obj);
  window.__loaded.hand = true;
}, undefined, (err) => { window.__loaded.err += "hand " + err; });

function handMesh() {
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xe2b190, roughness: 0.55 });
  const palm = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.28, 1.7), skin);
  g.add(palm);
  for (let i = 0; i < 4; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.18, 0.7), skin);
    f.position.set(-0.48 + i * 0.32, 0.02, 1.05);
    g.add(f);
  }
  const thumb = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.18, 0.5), skin);
  thumb.position.set(-0.9, 0, 0.35);
  thumb.rotation.y = 0.7;
  g.add(thumb);
  return g;
}
hand.position.set(1.6, 4.2, 0.4);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tableHit = new THREE.Vector3();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let v = [], syn = [], ref = [];
let ttmnAt = null;
let heat = { lc4: 0, gf: 0, ttmn: 0 };
let mode = "hover";
let slapStart = 0, slapMs = 200, h0 = 4.2, align = 1, prevTheta = null, simMs = 0;
let handXZ = new THREE.Vector3(0.4, 0, 0.2);
let flyHome = new THREE.Vector3();
let jumpFrom = new THREE.Vector3();
let jumpTo = new THREE.Vector3();
let jumpStart = 0;
let hits = 0, escapes = 0;
const trail = [];

function resetNet() {
  v = Array(N).fill(0);
  syn = Array(N).fill(0);
  ref = Array(N).fill(0);
  ttmnAt = null;
  heat = { lc4: 0, gf: 0, ttmn: 0 };
  prevTheta = null;
  simMs = 0;
}

function step(dth) {
  const I = Array(N).fill(0);
  C.edges.forEach((e) => { I[e.post] += syn[e.pre] * e.synapses * C.wSyn * e.sign; });
  for (let i = 0; i < 8; i++) I[i] += C.gain * dth;
  for (let i = 0; i < N; i++) {
    if (ref[i] > 0) { ref[i] -= 1; v[i] = 0; syn[i] *= sdecay; continue; }
    v[i] = decay * v[i] + I[i];
    syn[i] *= sdecay;
    if (v[i] >= 1) {
      v[i] = 0; ref[i] = 2; syn[i] += 1;
      if (i < 8) heat.lc4 = 1;
      else if (i === 8) heat.gf = 1;
      else heat.ttmn = 1;
      if (i === 9 && ttmnAt == null) ttmnAt = simMs;
    }
  }
  simMs += 1;
}

document.getElementById("note").textContent =
  "Ten real cells from the public MaleCNS map. Eight LC4 cells connect to the giant fiber, 58 to 67 synapses each. The giant fiber connects to TTMn with 70. A box lights up when that cell passes the signal on.";

const result = document.getElementById("result");
function say(text) { result.textContent = text; }
const banner = document.getElementById("banner");
let bannerTimer = 0;
function flash(text, who) {
  banner.textContent = text; banner.className = "on " + who;
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { banner.className = who; }, 1500);
  document.getElementById("sh").textContent = hits; document.getElementById("sf").textContent = escapes;
}

function slapPace() {
  const u = Number(document.getElementById("speed").value) / 100;
  const label = u < 0.34 ? "slow" : u > 0.7 ? "fast" : "medium";
  document.getElementById("speedn").textContent = label;
  return { h0: 4.2 - u * 2.5, ms: Math.round(800 - u * 755) };
}
document.getElementById("speed").oninput = slapPace;

function onPointer(e) {
  const rect = view.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, pt)) return;
  pt.x = Math.max(-11, Math.min(11, pt.x));
  pt.z = Math.max(-6.5, Math.min(6.5, pt.z));
  if (mode === "hover") handXZ.copy(pt);
  const now = performance.now();
  trail.push({ t: now, x: e.clientX, y: e.clientY });
  while (trail.length && now - trail[0].t > 140) trail.shift();
}
view.addEventListener("pointermove", onPointer);
view.addEventListener("pointerdown", (e) => {
  onPointer(e);
  if (mode !== "hover") return;
  const now = performance.now();
  const pace = slapPace();
  h0 = pace.h0;
  slapMs = pace.ms;
  const dx = handXZ.x - fly.position.x;
  const dz = handXZ.z - fly.position.z;
  const dist = Math.hypot(dx, dz);
  align = Math.exp(-(dist * dist) / (2 * 1.15 * 1.15));
  resetNet();
  hand.position.set(handXZ.x, h0, handXZ.z);
  slapStart = now;
  ringAt = now; ring.position.x = handXZ.x; ring.position.z = handXZ.z;
  mode = "down";
  say("");
});

function startJump() {
  mode = "jump";
  jumpStart = performance.now();
  jumpFrom.set(fly.position.x, 0, fly.position.z);
  const limitX = 10.2;
  const limitZ = 6.0;
  const nearEdge = Math.abs(fly.position.x) > limitX - 2.4 || Math.abs(fly.position.z) > limitZ - 2.4;
  let dx = nearEdge ? -fly.position.x : fly.position.x - handXZ.x;
  let dz = nearEdge ? -fly.position.z : fly.position.z - handXZ.z;
  let norm = Math.hypot(dx, dz);
  if (norm < 0.25) { dx = -fly.position.x || 1; dz = -fly.position.z; norm = Math.hypot(dx, dz) || 1; }
  let tx = fly.position.x + dx / norm * 8;
  let tz = fly.position.z + dz / norm * 8;
  tx = Math.max(-limitX, Math.min(5.5, tx));
  tz = Math.max(-limitZ, Math.min(limitZ, tz));
  if (Math.hypot(tx - fly.position.x, tz - fly.position.z) < 1.5) {
    tx = fly.position.x * 0.2 - 4;
    tz = fly.position.z * 0.2;
  }
  jumpTo.set(tx, 0, tz);
  escapes += 1;
  say("The signal reached the leg, and the fly jumped.");
  flash("The fly wins", "fly");
}
function landedHit() {
  mode = "hit";
  hits += 1;
  say("The hand landed first.");
  flash("Hit", "hand");
  setTimeout(() => { if (mode === "hit") mode = "hover"; }, 450);
}

const bview = document.getElementById("brainmap");
const brainRenderer = new THREE.WebGLRenderer({ canvas: bview, antialias: true });
brainRenderer.setClearColor(0xfaf8f2, 1);
const brainScene = new THREE.Scene();
const brainCamera = new THREE.PerspectiveCamera(32, 1, 1, 8000);
const glowGroup = new THREE.Group();
brainScene.add(glowGroup);
const glowMat = {};
const glowColor = {
  lc4: new THREE.Color(0x2563eb),
  gf: new THREE.Color(0xe08a00),
  ttmn: new THREE.Color(0x15803d),
};
if (window.MALE_DETAIL) {
  MALE_DETAIL.shells.forEach((shell) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(shell.vertices, 3));
    geo.setIndex(new THREE.Uint32BufferAttribute(shell.faces, 1));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0x8f9bb0,
      transparent: true,
      opacity: 0.1,
      side: THREE.DoubleSide,
      depthWrite: false,
    }));
    mesh.frustumCulled = false;
    glowGroup.add(mesh);
  });
}
glowGroup.rotation.y = Math.PI / 2;
GLOW.forEach((part) => {
  const pos = [];
  part.lines.forEach((pts) => {
    for (let i = 0; i < pts.length - 1; i++) {
      pos.push(pts[i][0], pts[i][1], pts[i][2], pts[i + 1][0], pts[i + 1][1], pts[i + 1][2]);
    }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0x8f8a7e, transparent: true, opacity: 0.6 });
  glowGroup.add(new THREE.LineSegments(geo, mat));
  glowMat[part.id] = mat;
});
const glowBox = new THREE.Box3().setFromObject(glowGroup);
glowGroup.position.sub(glowBox.getCenter(new THREE.Vector3()));
const glowSize = glowBox.getSize(new THREE.Vector3());
const glowFit = Math.max(glowSize.x, glowSize.y, glowSize.z);
const fitDist = (glowFit * 0.6) / Math.tan(THREE.MathUtils.degToRad(brainCamera.fov / 2));
brainCamera.position.set(0, glowFit * 0.02, fitDist);
brainCamera.lookAt(0, 0, 0);

function mapCentroid(vertices) {
  let x = 0, y = 0, z = 0, n = 0;
  for (let i = 0; i < vertices.length; i += 3) {
    x += vertices[i]; y += vertices[i + 1]; z += vertices[i + 2]; n += 1;
  }
  return new THREE.Vector3(x / n, y / n, z / n);
}
function mapLabel(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 96;
  const g = canvas.getContext("2d");
  g.font = "44px Georgia";
  g.fillStyle = "#16150f";
  g.textBaseline = "middle";
  g.fillText(text, 12, 48);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas),
    transparent: true,
    depthTest: false,
  }));
  sprite.scale.set(glowFit * 0.5, glowFit * 0.094, 1);
  return sprite;
}
if (window.MALE_DETAIL) {
  const spots = [
    ["Right optic lobe", "LC4"],
    ["Central brain", "Giant fiber"],
    ["Neck", "Neck"],
    ["Ventral nerve cord", "TTMn"],
  ];
  const byName = {};
  MALE_DETAIL.shells.forEach((shell) => { byName[shell.name] = mapCentroid(shell.vertices); });
  const mid = new THREE.Vector3();
  Object.values(byName).forEach((p) => mid.add(p));
  mid.multiplyScalar(1 / Object.keys(byName).length);
  spots.forEach(([name, text]) => {
    const from = byName[name];
    if (!from) return;
    const dir = from.clone().sub(mid);
    if (dir.lengthSq() < 1) dir.set(1, 0.2, 0);
    dir.normalize();
    const to = from.clone().addScaledVector(dir, glowFit * 0.16);
    const lineGeo = new THREE.BufferGeometry().setFromPoints([from, to]);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xa39f95 }));
    line.frustumCulled = false;
    const tag = mapLabel(text);
    tag.position.copy(to);
    glowGroup.add(line);
    glowGroup.add(tag);
  });
}
let mapDrag = false;
let mapX = 0;
let mapY = 0;
bview.addEventListener("pointerdown", (e) => {
  mapDrag = true;
  mapX = e.clientX;
  mapY = e.clientY;
  bview.setPointerCapture(e.pointerId);
  e.stopPropagation();
});
bview.addEventListener("pointerup", () => { mapDrag = false; });
bview.addEventListener("pointermove", (e) => {
  if (!mapDrag) return;
  glowGroup.rotation.y += (e.clientX - mapX) * 0.01;
  glowGroup.rotation.x = Math.max(-1.2, Math.min(1.2, glowGroup.rotation.x + (e.clientY - mapY) * 0.01));
  mapX = e.clientX;
  mapY = e.clientY;
  e.stopPropagation();
});

const restColor = new THREE.Color(0x8f8a7e);
function tint(id, label) {
  const hot = heat[id];
  const mat = glowMat[id];
  mat.color.copy(restColor).lerp(glowColor[id], Math.min(1, hot * 1.6));
  mat.opacity = 0.6 + 0.4 * hot;
  const slot = id === "lc4" ? "lc4n" : id === "gf" ? "gfn" : "ttn";
  document.getElementById(slot).classList.toggle("on", hot > 0.28);
}

const phoneQuery = window.matchMedia("(max-width: 820px), (max-height: 520px) and (pointer: coarse)");
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / Math.max(1, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, phoneQuery.matches ? 1.25 : 1.75));
  renderer.setSize(w, h, false);
  if (phoneQuery.matches) {
    const halfWide = Math.atan(Math.tan(18 * Math.PI / 180) * 1.6);
    camera.fov = Math.min(100, 2 * Math.atan(Math.tan(halfWide) / aspect) * 180 / Math.PI);
  } else {
    camera.fov = 36;
  }
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  const bw = bview.clientWidth, bh = bview.clientHeight;
  brainRenderer.setSize(bw, bh, false);
  brainCamera.aspect = bw / Math.max(1, bh);
  brainCamera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
document.getElementById("fold").onclick = () => {
  const side = document.getElementById("side");
  const folded = side.classList.toggle("folded");
  document.getElementById("fold").textContent = folded ? "Map" : "Hide";
  requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
};
resize();
say("The three boxes light up when a cell passes the signal on.");

function frame(now) {
  if (mode === "hover") {
    hand.position.x += (handXZ.x - hand.position.x) * 0.35;
    hand.position.z += (handXZ.z - hand.position.z) * 0.35;
    hand.position.y = 4.2;
  } else if (mode === "down") {
    const u = Math.min(1, (now - slapStart) / slapMs);
    const h = h0 + (0.55 - h0) * u;
    hand.position.y = h;
    const due = Math.min(slapMs, now - slapStart);
    while (simMs < due) {
      const k = simMs / Math.max(1, slapMs - 1);
      const hh = h0 + (0.55 - h0) * k;
      const theta = Math.atan(C.handR / Math.max(hh, 0.3)) * align;
      const dth = prevTheta == null ? 0 : Math.max(0, theta - prevTheta);
      prevTheta = theta;
      step(dth);
    }
    const dist = Math.hypot(hand.position.x - fly.position.x, hand.position.z - fly.position.z);
    if (ttmnAt != null && simMs >= ttmnAt + C.jumpAfterMs) startJump();
    else if (h <= 0.62 && dist < 1.15) landedHit();
    else if (u >= 1) { mode = "hover"; say("Missed. Put the shadow of the hand over the fly."); }
  } else if (mode === "jump") {
    const u = Math.min(1, (now - jumpStart) / 70);
    fly.position.x = jumpFrom.x + (jumpTo.x - jumpFrom.x) * u;
    fly.position.z = jumpFrom.z + (jumpTo.z - jumpFrom.z) * u;
    fly.position.y = Math.sin(u * Math.PI) * 4.4;
    if (u >= 1) { fly.position.y = 0; mode = "hover"; }
  } else if (mode === "hit") {
    fly.position.y = 0;
    fly.rotation.z = Math.sin(now / 30) * 0.25;
  }
  if (slapStart && now < slapStart + slapMs && mode !== "down") {
    const u = (now - slapStart) / slapMs;
    hand.position.y = h0 + (0.55 - h0) * u;
  } else if (mode !== "down") {
    hand.position.y += (4.2 - hand.position.y) * 0.05;
  }
  if (mode !== "hit") fly.rotation.z *= 0.9;
  if (mode === "hover" && fly.userData.wings) {
    const flap = Math.sin(now / 70) * 0.35;
    fly.userData.wings[0].rotation.z = flap;
    fly.userData.wings[1].rotation.z = -flap;
  }
  heat.lc4 *= 0.9;
  heat.gf *= 0.9;
  heat.ttmn *= 0.9;
  if (v.length === N) {
    let mean = 0;
    for (let i = 0; i < 8; i++) mean += v[i];
    heat.lc4 = Math.max(heat.lc4, Math.min(1, mean / 8));
    heat.gf = Math.max(heat.gf, Math.min(1, v[8]));
    heat.ttmn = Math.max(heat.ttmn, Math.min(1, v[9]));
  }
  tint("lc4", "LC4");
  tint("gf", "Giant fiber");
  tint("ttmn", "TTMn");
  handShadow.position.x = hand.position.x; handShadow.position.z = hand.position.z;
  const hs = 0.55 + hand.position.y * 0.16; handShadow.scale.set(hs, hs, 1); handShadow.material.opacity = 0.2 - Math.min(0.14, hand.position.y * 0.034);
  flyShadow.position.x = fly.position.x; flyShadow.position.z = fly.position.z; flyShadow.material.opacity = Math.max(0.04, 0.2 - fly.position.y * 0.05);
  const ru = (now - ringAt) / 520; ring.material.opacity = ru < 1 ? 0.8 * (1 - ru) : 0; ring.scale.setScalar(1 + ru * 1.3);
  brainRenderer.render(brainScene, brainCamera);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
